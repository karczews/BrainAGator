name: CI / gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    # Do not add `paths:` or other filters here. This workflow owns the required
    # "Required Checks Validation" check, so it must report on every PR.

permissions:
  contents: read

jobs:
  conventional-commits:
    name: Check Conventional Commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for Conventional Commit compliance
        uses: tomtom-international/commisery-action@v8
        with:
          token: ${{ github.token }}

  unit-tests:
    uses: ./.github/workflows/run-tests.yml

  check-copyrights:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/check-copyrights.yml

  check-formatting:
    uses: ./.github/workflows/check-formatting.yml

  detekt:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/detekt.yml
    with:
      sha: ${{ github.event.pull_request.head.sha }}

  android-instrumentation-tests:
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/android-instrumentation-tests.yml

  ios-build:
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ios-build.yml

  wasm-build:
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/wasm-build.yml

  gate:
    name: Required Checks Validation
    # This job is the required check. It must run even when a dependency fails,
    # otherwise GitHub reports it as skipped and treats a skipped required check
    # as passing. Keep it PR-only: that is where branch protection applies.
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Every required check must be listed here; jobs not listed are not
    # validated by this gate.
    needs: [unit-tests, check-copyrights, check-formatting, detekt, android-instrumentation-tests, ios-build, wasm-build, conventional-commits]
    steps:
      - name: Fail on non-successful required check
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Required checks: ${{ join(needs.*.result, ', ') }}"
          exit 1

      - name: Confirm required checks succeeded
        if: success()
        run: echo "All required checks succeeded."
