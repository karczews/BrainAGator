name: Unit Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17.0.20+101'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run tests
        run: ./gradlew testDebug

  screenshot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17.0.20+101'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify screenshots
        # Desktop UI tests need an X server (xvfb) and configuration cache
        # stays off: :composeApp:jvmTest cannot store the cache entry
        # (pre-existing material-icons-extended variant ambiguity, also on main).
        run: xvfb-run -a ./gradlew :composeApp:verifyRoborazziJvm --no-configuration-cache

      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: |
            composeApp/build/outputs/roborazzi
            composeApp/build/reports/roborazzi
            composeApp/build/reports/tests/jvmTest
          retention-days: 7
